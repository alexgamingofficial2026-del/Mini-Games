<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blox Fruits - Réplica HTML</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; font-family: 'Trebuchet MS', sans-serif; }
  body { overflow: hidden; background: #000; width: 100vw; height: 100vh; touch-action: none; }

  /* ===== PANTALLA DE SELECCIÓN ===== */
  #menu-screen {
    position: fixed; inset: 0; z-index: 100;
    background: linear-gradient(135deg, #4ca1af, #2c3e50);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.5s;
  }
  .menu-title {
    background: rgba(0,0,0,0.8); color: white;
    padding: 10px 40px; font-size: 24px; font-weight: bold;
    border-radius: 8px; margin-bottom: 20px; border: 2px solid #555;
  }
  .cards-container { display: flex; gap: 20px; align-items: center; justify-content: center; width: 90%; max-width: 800px; }
  .card {
    width: 45%; max-width: 300px; border: 4px solid; border-radius: 10px;
    display: flex; flex-direction: column; cursor: pointer; transition: transform 0.2s;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow: hidden;
  }
  .card:hover { transform: scale(1.05); }
  .card-pirate { border-color: #ff3333; background: linear-gradient(to bottom, #660000, #220000); }
  .card-marine { border-color: #3388ff; background: linear-gradient(to bottom, #001155, #000022); }
  .card-header { height: 150px; background-size: cover; background-position: center; border-bottom: 2px solid rgba(255,255,255,0.2); }
  .card-title { font-size: 28px; font-weight: 900; color: white; text-align: center; text-shadow: 2px 2px 0 #000; padding: 10px 0; }
  .card-stats { background: rgba(0,0,0,0.8); color: white; padding: 8px; text-align: center; font-size: 12px; font-weight: bold; }
  .vs-text { font-size: 36px; font-weight: 900; color: white; text-shadow: 2px 2px 0 #000; font-style: italic; }

  /* ===== MUNDO 3D (CSS) ===== */
  #world {
    position: absolute; inset: 0; perspective: 800px; overflow: hidden;
    background: linear-gradient(to bottom, #87CEEB 0%, #b0e0e6 60%, #deb887 100%);
  }
  #camera {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transition: transform 0.1s linear;
  }
  .face { position: absolute; backface-visibility: hidden; }
  
  /* Suelo */
  .ground { width: 3000px; height: 3000px; background: #7cba5c; transform: rotateX(90deg) translateZ(-1px); left: -1500px; top: -1500px; box-shadow: inset 0 0 200px rgba(0,0,0,0.5); }
  .path { width: 2000px; height: 300px; background: #d4b88a; transform: rotateX(90deg) translateZ(0px); left: -1000px; top: -150px; }

  /* Construcciones */
  .building { position: absolute; transform-style: preserve-3d; }
  .b-face { position: absolute; backface-visibility: hidden; border: 1px solid rgba(0,0,0,0.2); }
  
  /* Personaje */
  #player { position: absolute; width: 0; height: 0; transform-style: preserve-3d; z-index: 100; }
  .part { position: absolute; border: 2px solid #000; transform-style: preserve-3d; }
  .head { width: 40px; height: 40px; background: #ffcc99; left: -20px; top: -90px; transform: translateZ(0); }
  .hair { width: 42px; height: 15px; background: #111; left: -21px; top: -95px; transform: translateZ(1px); }
  .torso { width: 44px; height: 50px; background: #00ff00; left: -22px; top: -50px; transform: translateZ(0); border-radius: 5px; }
  .cape { width: 60px; height: 30px; background: #fff; left: -30px; top: -55px; transform: translateZ(-5px); border-radius: 50% 50% 10% 10%; }
  .leg { width: 18px; height: 40px; background: #111; top: 0px; transform-origin: top center; }
  .arm { width: 14px; height: 45px; background: #00ff00; top: -50px; transform-origin: top center; }
  .leg-l { left: -20px; } .leg-r { left: 2px; }
  .arm-l { left: -36px; } .arm-r { left: 22px; }
  
  /* Objetos escenario */
  .tree { position: absolute; width: 30px; height: 80px; background: #8b5a2b; transform-style: preserve-3d; border: 1px solid #000; }
  .tree-top { position: absolute; width: 60px; height: 60px; background: #2d7a2d; left: -15px; top: -40px; border-radius: 50%; border: 1px solid #000; box-shadow: inset -10px -10px 20px rgba(0,0,0,0.5); }

  /* ===== HUD ===== */
  #game-ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: none; }
  
  /* Top Bar */
  .top-bar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; }
  .menu-btn { background: #ffcc00; color: #000; font-weight: bold; border: 2px solid #fff; border-radius: 4px; padding: 5px 20px; font-size: 14px; box-shadow: 0 2px 5px #000; }
  
  /* Info Jugador */
  .player-info { position: absolute; top: 60px; left: 15px; display: flex; flex-direction: column; gap: 4px; text-shadow: 2px 2px 0 #000; }
  .level-txt { color: white; font-size: 18px; font-weight: bold; }
  .xp-bar-bg { width: 140px; height: 10px; background: #222; border: 1px solid #000; border-radius: 4px; position: relative; }
  .xp-bar-fill { width: 60%; height: 100%; background: #a000ff; }
  .xp-text { position: absolute; top: -2px; width: 100%; text-align: center; font-size: 8px; color: white; font-weight: bold; }
  .money-txt { color: #00ff00; font-size: 16px; font-weight: bold; }

  /* Barras Salud / Energía */
  .stats-container { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; width: 90%; max-width: 450px; }
  .stat-bar { flex: 1; height: 28px; border: 2px solid #000; border-radius: 4px; position: relative; background: #333; box-shadow: 0 3px 0 #000; overflow: hidden; }
  .health-fill { width: 100%; height: 100%; background: #33ff33; transition: width 0.2s; }
  .energy-fill { width: 100%; height: 100%; background: #33ffff; transition: width 0.2s; }
  .stat-text { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 8px; color: white; font-size: 11px; font-weight: bold; text-shadow: 1px 1px 0 #000; }

  /* Habilidades */
  .skills-container { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; }
  .skill-slot { width: 45px; height: 45px; background: #222; border: 2px solid #555; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 3px 0 #000; }
  .skill-slot.active { border-color: #fff; background: #444; }

  /* Joystick */
  .joystick-area { position: absolute; bottom: 20px; left: 20px; width: 110px; height: 110px; background: rgba(0,0,0,0.2); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; pointer-events: auto; }
  .joystick-knob { position: absolute; top: 50%; left: 50%; width: 45px; height: 45px; margin: -22.5px 0 0 -22.5px; background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.6); border-radius: 50%; }
  
  /* Botón Salto */
  .jump-btn { position: absolute; bottom: 30px; right: 30px; width: 65px; height: 65px; background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; pointer-events: auto; display: flex; align-items: center; justify-content: center; color: white; font-size: 30px; box-shadow: 0 4px 0 rgba(0,0,0,0.5); }
  .jump-btn:active { transform: translateY(4px); box-shadow: 0 0 0 rgba(0,0,0,0.5); }

  /* Notificación */
  #notification { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 8px 20px; border-radius: 20px; font-size: 16px; font-weight: bold; opacity: 0; transition: opacity 0.5s; text-shadow: 1px 1px 0 #000; pointer-events: none; border: 2px solid #555; }
</style>
</head>
<body>

<!-- PANTALLA DE SELECCIÓN -->
<div id="menu-screen">
  <div class="menu-title">Pick A Side!</div>
  <div class="cards-container">
    <div class="card card-pirate" onclick="startGame('Piratas')">
      <div class="card-header" style="background-image: url('https://tr.rbxcdn.com/180DAY-7b96ff082e900c48d01017011316fdb9/420/420/Image/Png/noFilter');"></div>
      <div class="card-title">PIRATAS</div>
      <div class="card-stats">Bounty: $2,503,366</div>
    </div>
    <div class="vs-text">VS</div>
    <div class="card card-marine" onclick="startGame('Marinas')">
      <div class="card-header" style="background-image: url('https://tr.rbxcdn.com/180DAY-8f5b75f9c0e6c2f3a5c9455fb0b4f1a1/420/420/Image/Png/noFilter');"></div>
      <div class="card-title">MARINAS</div>
      <div class="card-stats">Honor: $2,510,531</div>
    </div>
  </div>
</div>

<!-- JUEGO -->
<div id="game-ui">
  <div class="top-bar">
    <div class="menu-btn">Menú</div>
  </div>

  <div class="player-info">
    <div class="level-txt">Lv. 2752</div>
    <div class="xp-bar-bg">
      <div class="xp-bar-fill"></div>
      <div class="xp-text">114,912 / 163,012,763</div>
    </div>
    <div class="money-txt">$ 367,682</div>
  </div>

  <div id="notification"></div>

  <div class="stats-container">
    <div class="stat-bar">
      <div class="health-fill" id="health-fill"></div>
      <div class="stat-text"><span>Salud</span><span id="health-val">13955/13955</span></div>
    </div>
    <div class="stat-bar">
      <div class="energy-fill" id="energy-fill"></div>
      <div class="stat-text"><span>Energy</span><span id="energy-val">13955/13955</span></div>
    </div>
  </div>

  <div class="skills-container">
    <div class="skill-slot active" style="color:#00ffff;">✋</div>
    <div class="skill-slot" style="color:#ff00ff;">☠️</div>
    <div class="skill-slot">🪄</div>
    <div class="skill-slot">🪝</div>
    <div class="skill-slot">➕</div>
  </div>

  <div class="joystick-area" id="joystick">
    <div class="joystick-knob" id="knob"></div>
  </div>
  <div class="jump-btn" id="jump-btn">▲</div>
</div>

<!-- MUNDO 3D -->
<div id="world">
  <div id="camera">
    <!-- Suelo -->
    <div class="face ground"></div>
    <div class="face path"></div>
    
    <!-- Construcciones generadas por JS -->
    <div id="buildings"></div>
    
    <!-- Jugador -->
    <div id="player">
      <div class="part head"></div>
      <div class="part hair"></div>
      <div class="part cape"></div>
      <div class="part torso"></div>
      <div class="part leg leg-l" id="legL"></div>
      <div class="part leg leg-r" id="legR"></div>
      <div class="part arm arm-l" id="armL"></div>
      <div class="part arm arm-r" id="armR"></div>
    </div>
  </div>
</div>

<script>
// ===== CONFIGURACIÓN DEL JUEGO =====
const state = {
  x: 0, z: 0, y: 0,
  rotY: 0,
  velY: 0,
  isJumping: false,
  camYaw: 0,
  camPitch: 0.5,
  camDist: 400, // Distancia de la cámara
  speed: 8,
  keys: { w: false, a: false, s: false, d: false },
  joystick: { x: 0, y: 0 },
  isPlaying: false
};

const camEl = document.getElementById('camera');
const playerEl = document.getElementById('player');
const legL = document.getElementById('legL');
const legR = document.getElementById('legR');
const armL = document.getElementById('armL');
const armR = document.getElementById('armR');

// ===== GENERAR CIUDAD (ESTILO BLOX FRUITS) =====
function generateCity() {
  const container = document.getElementById('buildings');
  const colors = ['#ff9999', '#99ff99', '#9999ff', '#ffff99', '#ffcc99', '#ff99cc'];
  
  for(let i = 0; i < 30; i++) {
    let bx = (Math.random() - 0.5) * 2000;
    let bz = (Math.random() - 0.5) * 2000;
    
    // Dejar el centro libre
    if (Math.abs(bx) < 300 && Math.abs(bz) < 200) {
      bx += bx > 0 ? 400 : -400;
    }

    let bw = 100 + Math.random() * 150;
    let bh = 150 + Math.random() * 250;
    let bd = 100 + Math.random() * 150;
    let color = colors[Math.floor(Math.random() * colors.length)];

    const b = document.createElement('div');
    b.className = 'building';
    b.style.left = bx + 'px';
    b.style.top = bz + 'px';
    b.style.transformStyle = 'preserve-3d';

    // Caras del edificio (Frontal, Trasera, Izq, Der, Techo)
    const faces = [
      { w: bw, h: bh, t: `translateZ(${bd/2}px)`, bg: color, l: -bw/2, tp: -bh, br: '1px solid #000' },
      { w: bw, h: bh, t: `rotateY(180deg) translateZ(${bd/2}px)`, bg: color, l: -bw/2, tp: -bh, br: '1px solid #000' },
      { w: bd, h: bh, t: `rotateY(-90deg) translateZ(${bw/2}px)`, bg: color, l: -bd/2, tp: -bh, br: '1px solid #000' },
      { w: bd, h: bh, t: `rotateY(90deg) translateZ(${bw/2}px)`, bg: color, l: -bd/2, tp: -bh, br: '1px solid #000' },
      { w: bw, h: bd, t: `rotateX(90deg) translateZ(${bh/2}px)`, bg: '#880000', l: -bw/2, tp: -bd/2, br: '1px solid #000' }
    ];

    faces.forEach(f => {
      const face = document.createElement('div');
      face.className = 'b-face';
      face.style.width = f.w + 'px';
      face.style.height = f.h + 'px';
      face.style.left = (f.l || -f.w/2) + 'px';
      face.style.top = (f.tp || -f.h/2) + 'px';
      face.style.transform = f.t;
      face.style.background = f.bg;
      face.style.border = f.br;
      // Simular sombra interior
      face.style.boxShadow = 'inset 0 0 50px rgba(0,0,0,0.3)';
      b.appendChild(face);
    });

    container.appendChild(b);
  }
}
generateCity();

// ===== LÓGICA DE CONTROLES =====
const joystick = document.getElementById('joystick');
const knob = document.getElementById('knob');
const jumpBtn = document.getElementById('jump-btn');
let joystickActive = false;
let joystickCenter = { x: 0, y: 0 };
const maxDist = 35;

// Teclado
document.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'w') state.keys.w = true;
  if (e.key.toLowerCase() === 'a') state.keys.a = true;
  if (e.key.toLowerCase() === 's') state.keys.s = true;
  if (e.key.toLowerCase() === 'd') state.keys.d = true;
});
document.addEventListener('keyup', e => {
  if (e.key.toLowerCase() === 'w') state.keys.w = false;
  if (e.key.toLowerCase() === 'a') state.keys.a = false;
  if (e.key.toLowerCase() === 's') state.keys.s = false;
  if (e.key.toLowerCase() === 'd') state.keys.d = false;
});

// Joystick Táctil / Ratón
function handleJoystickStart(e) {
  joystickActive = true;
  const rect = joystick.getBoundingClientRect();
  joystickCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
  if (e.type === 'touchstart') e.preventDefault();
}
function handleJoystickMove(e) {
  if (!joystickActive) return;
  if (e.type === 'touchmove') e.preventDefault();
  
  let cx = e.touches ? e.touches[0].clientX : e.clientX;
  let cy = e.touches ? e.touches[0].clientY : e.clientY;

  let dx = cx - joystickCenter.x;
  let dy = cy - joystickCenter.y;
  const dist = Math.hypot(dx, dy);
  
  if (dist > maxDist) {
    dx = (dx / dist) * maxDist;
    dy = (dy / dist) * maxDist;
  }
  
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  
  state.joystick.x = dx / maxDist;
  state.joystick.y = -dy / maxDist;
}
function handleJoystickEnd() {
  joystickActive = false;
  knob.style.transform = `translate(0px, 0px)`;
  state.joystick.x = 0;
  state.joystick.y = 0;
}

joystick.addEventListener('mousedown', handleJoystickStart);
document.addEventListener('mousemove', handleJoystickMove);
document.addEventListener('mouseup', handleJoystickEnd);
joystick.addEventListener('touchstart', handleJoystickStart, {passive: false});
document.addEventListener('touchmove', handleJoystickMove, {passive: false});
document.addEventListener('touchend', handleJoystickEnd);

// Salto
function doJump() {
  if (!state.isJumping) {
    state.velY = 12;
    state.isJumping = true;
  }
}
jumpBtn.addEventListener('mousedown', doJump);
jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); doJump(); }, {passive: false});

// Rotar cámara arrastrando el fondo (Ratón)
let isDraggingCam = false;
let lastMouseX = 0;
document.getElementById('world').addEventListener('mousedown', (e) => {
  if (e.target.id === 'world' || e.target.id === 'camera') {
    isDraggingCam = true;
    lastMouseX = e.clientX;
  }
});
document.addEventListener('mousemove', (e) => {
  if (isDraggingCam) {
    const deltaX = e.clientX - lastMouseX;
    state.camYaw -= deltaX * 0.01;
    lastMouseX = e.clientX;
  }
});
document.addEventListener('mouseup', () => { isDraggingCam = false; });

// ===== BUCLE DE ANIMACIÓN =====
let lastTime = performance.now();

function gameLoop(time) {
  requestAnimationFrame(gameLoop);
  if (!state.isPlaying) return;

  const dt = Math.min((time - lastTime) / 1000, 0.1);
  lastTime = time;

  // Movimiento
  let moveX = 0, moveZ = 0;
  if (state.keys.w) moveZ += 1;
  if (state.keys.s) moveZ -= 1;
  if (state.keys.a) moveX -= 1;
  if (state.keys.d) moveX += 1;
  
  moveX += state.joystick.x;
  moveZ += state.joystick.y;

  let isMoving = false;

  if (Math.abs(moveX) > 0.1 || Math.abs(moveZ) > 0.1) {
    isMoving = true;
    
    // Calcular ángulo de movimiento relativo a la cámara
    const angle = Math.atan2(moveX, moveZ);
    const targetRot = angle + state.camYaw;
    
    // Suavizar rotación
    let diff = targetRot - state.rotY;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    state.rotY += diff * dt * 10;

    // Mover
    const len = Math.hypot(moveX, moveZ);
    const speed = state.speed * Math.min(len, 1);
    state.x += Math.sin(state.rotY) * speed * dt;
    state.z += Math.cos(state.rotY) * speed * dt;
  }

  // Física de salto
  if (state.isJumping) {
    state.velY -= 35 * dt;
    state.y += state.velY * dt;
    if (state.y <= 0) {
      state.y = 0;
      state.isJumping = false;
      state.velY = 0;
    }
  }

  // Animación del personaje (Caminar)
  if (isMoving) {
    const walkTime = time * 0.015;
    const swing = Math.sin(walkTime) * 35;
    legL.style.transform = `rotateX(${swing}deg)`;
    legR.style.transform = `rotateX(${-swing}deg)`;
    armL.style.transform = `rotateX(${-swing}deg)`;
    armR.style.transform = `rotateX(${swing}deg)`;
  } else {
    legL.style.transform = `rotateX(0deg)`;
    legR.style.transform = `rotateX(0deg)`;
    armL.style.transform = `rotateX(0deg)`;
    armR.style.transform = `rotateX(0deg)`;
  }

  // Actualizar transformaciones 3D
  // El suelo está en y=0, el jugador "flota" a y+30 para que los pies toquen el suelo
  const py = -state.y - 30;
  playerEl.style.transform = `translate3d(${state.x}px, ${py}px, ${state.z}px) rotateY(${state.rotY}rad)`;
  
  // Cámara sigue al jugador
  const camX = state.x - Math.sin(state.camYaw) * state.camDist;
  const camZ = state.z - Math.cos(state.camYaw) * state.camDist;
  const camY = -300 - state.y + (state.camPitch * 300);
  
  camEl.style.transform = `translate3d(${-camX}px, ${camY}px, ${-camZ}px) rotateX(${state.camPitch * 60}deg) rotateY(${state.camYaw}rad)`;
}

requestAnimationFrame(gameLoop);

// ===== INICIAR JUEGO =====
function startGame(faction) {
  document.getElementById('menu-screen').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('menu-screen').style.display = 'none';
  }, 500);
  
  document.getElementById('game-ui').style.display = 'block';
  
  const notif = document.getElementById('notification');
  notif.innerHTML = `Unido al equipo de &lt;${faction}&gt;.`;
  notif.style.opacity = '1';
  setTimeout(() => notif.style.opacity = '0', 3000);
  
  state.isPlaying = true;
  lastTime = performance.now();

  // Simular pérdida de energía/daño visual
  setInterval(() => {
    if (!state.isPlaying) return;
    const hFill = document.getElementById('health-fill');
    const eFill = document.getElementById('energy-fill');
    const hVal = document.getElementById('health-val');
    
    const hp = 13500 + Math.random() * 455;
    hFill.style.width = (hp / 13955 * 100) + '%';
    hVal.innerText = `${Math.floor(hp)}/13955`;
    
    const en = 10000 + Math.random() * 3955;
    eFill.style.width = (en / 13955 * 100) + '%';
    document.getElementById('energy-val').innerText = `${Math.floor(en)}/13955`;
  }, 2000);
}
</script>
</body>
</html>
