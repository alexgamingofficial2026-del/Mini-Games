<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blox Fruits 3D - Vista Acostada</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body { overflow: hidden; background: #1a1a2e; font-family: sans-serif; }
    
    /* Interfaz */
    #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; color: white; }
    .panel { background: rgba(0,0,0,0.7); border: 2px solid #ff9f1c; border-radius: 8px; padding: 10px; }
    #stats { position: absolute; top: 10px; left: 10px; width: 180px; font-size: 12px; }
    #mission { position: absolute; top: 10px; right: 10px; width: 160px; font-size: 12px; }
    .bar { height: 10px; background: #333; border-radius: 5px; margin-top: 4px; overflow: hidden; }
    .fill { height: 100%; transition: width 0.2s; }
    #hpFill { background: #e74c3c; width: 100%; }
    #xpFill { background: #3498db; width: 0%; }
    
    /* Botones móviles */
    #controls {
        position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px;
        pointer-events: none; z-index: 20;
    }
    .btn {
        width: 65px; height: 65px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4);
        border-radius: 50%; color: white; font-size: 24px; display: flex; align-items: center; justify-content: center;
        pointer-events: auto; user-select: none; -webkit-user-select: none;
    }
    .btn:active { background: rgba(255,255,255,0.4); }
    
    #startScreen {
        position: absolute; inset: 0; background: #1a1a2e; display: flex; flex-direction: column;
        align-items: center; justify-content: center; z-index: 30; color: white; text-align: center;
    }
    h1 { color: #ff9f1c; font-size: 32px; margin-bottom: 20px; }
    #playBtn {
        padding: 15px 40px; background: #ff9f1c; border: none; border-radius: 30px;
        font-size: 20px; font-weight: bold; color: white; pointer-events: auto;
    }
</style>
</head>
<body>

<div id="ui">
    <div id="stats" class="panel">
        ❤️ Vida: <span id="hpText">100</span><br>
        <div class="bar"><div class="fill" id="hpFill"></div></div>
        ⭐ Nivel: <span id="lvlText">1</span><br>
        <div class="bar"><div class="fill" id="xpFill"></div></div>
        🍎 Frutas: <span id="fruitText">0</span>
    </div>
    <div id="mission" class="panel">
        📜 Misión: <br><span id="missionText">Recoge 2 frutas</span>
    </div>
</div>

<div id="controls">
    <div style="display:flex; gap:15px;">
        <div class="btn" id="btnLeft">←</div>
        <div class="btn" id="btnRight">→</div>
    </div>
    <div style="display:flex; gap:15px;">
        <div class="btn" id="btnJump">⬆️</div>
        <div class="btn" id="btnAttack">⚔️</div>
    </div>
</div>

<div id="startScreen">
    <h1>BLOX FRUITS 3D</h1>
    <p style="margin-bottom: 20px; color: #aaa;">Vista Acostada (Lateral)</p>
    <button id="playBtn">¡JUGAR AHORA!</button>
</div>

<!-- Three.js desde un CDN estable -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// Variables
let scene, camera, renderer, clock;
let player, enemies = [], fruits = [], bullets = [];
let isPlaying = false;
let moveLeft = false, moveRight = false;
let playerHp = 100, playerLevel = 1, playerXp = 0, playerXpMax = 100, fruitCount = 0;
let keys = {};

// Iniciar escena
function init() {
    // 1. Escena
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // Cielo azul claro

    // 2. Cámara (Vista Acostada / Lateral)
    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    // La cámara se coloca a la derecha del jugador, mirando hacia la izquierda
    camera.position.set(12, 6, 0); 
    camera.lookAt(0, 2, 0);

    // 3. Renderizador
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 4. Luces
    const ambient = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xffffff, 0.8);
    sun.position.set(10, 20, 10);
    sun.castShadow = true;
    scene.add(sun);

    // 5. Suelo (Isla)
    const floorGeo = new THREE.BoxGeometry(100, 2, 40);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x4caf50 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.position.set(0, -1, 0);
    floor.receiveShadow = true;
    scene.add(floor);

    // 6. Jugador (Cubo azul)
    player = new THREE.Mesh(
        new THREE.BoxGeometry(1.5, 2, 1.5),
        new THREE.MeshStandardMaterial({ color: 0x42a5f5 })
    );
    player.position.set(0, 1, 0);
    player.castShadow = true;
    scene.add(player);

    // 7. Reloj
    clock = new THREE.Clock();

    // 8. Eventos (Teclado y Botones)
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);
    window.addEventListener('resize', onResize);

    // Botones táctiles
    document.getElementById('btnLeft').addEventListener('touchstart', e => { e.preventDefault(); moveLeft = true; });
    document.getElementById('btnLeft').addEventListener('touchend', e => { e.preventDefault(); moveLeft = false; });
    document.getElementById('btnRight').addEventListener('touchstart', e => { e.preventDefault(); moveRight = true; });
    document.getElementById('btnRight').addEventListener('touchend', e => { e.preventDefault(); moveRight = false; });
    
    document.getElementById('btnJump').addEventListener('touchstart', e => { 
        e.preventDefault(); 
        if (player.position.y <= 1.1) player.velocityY = 12;
    });
    
    document.getElementById('btnAttack').addEventListener('touchstart', e => {
        e.preventDefault();
        shoot();
    });

    // Botón de inicio
    document.getElementById('playBtn').addEventListener('click', () => {
        document.getElementById('startScreen').style.display = 'none';
        isPlaying = true;
        spawnEnemy();
        spawnFruit();
    });

    // Iniciar bucle
    animate();
}

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// Generadores
function spawnEnemy() {
    if (enemies.length > 5) return;
    const enemy = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 1.2, 1.2),
        new THREE.MeshStandardMaterial({ color: 0xe53935 })
    );
    // Aparecen a los lados
    const side = Math.random() > 0.5 ? 1 : -1;
    enemy.position.set(side * 25, 1, (Math.random() - 0.5) * 15);
    enemy.speed = 0.05 + Math.random() * 0.05;
    scene.add(enemy);
    enemies.push(enemy);
}

function spawnFruit() {
    if (fruits.length > 3) return;
    const fruit = new THREE.Mesh(
        new THREE.SphereGeometry(0.8, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xffeb3b, emissive: 0x444400 })
    );
    fruit.position.set((Math.random() - 0.5) * 30, 1.5, (Math.random() - 0.5) * 10);
    scene.add(fruit);
    fruits.push(fruit);
}

function shoot() {
    if (!isPlaying) return;
    const bullet = new THREE.Mesh(
        new THREE.SphereGeometry(0.4, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0x00ffaa })
    );
    bullet.position.copy(player.position);
    bullet.velocity = new THREE.Vector3(1, 0, 0); // Dispara hacia la derecha
    scene.add(bullet);
    bullets.push(bullet);
}

// Actualizar UI
function updateUI() {
    document.getElementById('hpText').innerText = Math.floor(playerHp);
    document.getElementById('hpFill').style.width = Math.max(0, playerHp) + '%';
    document.getElementById('lvlText').innerText = playerLevel;
    document.getElementById('xpFill').style.width = (playerXp / playerXpMax * 100) + '%';
    document.getElementById('fruitText').innerText = fruitCount;
}

// Lógica del juego
function updateGame(delta) {
    // Movimiento
    let speed = 8 * delta;
    if (keys['KeyA'] || keys['ArrowLeft'] || moveLeft) {
        player.position.x -= speed;
        player.rotation.y = -Math.PI / 2;
    }
    if (keys['KeyD'] || keys['ArrowRight'] || moveRight) {
        player.position.x += speed;
        player.rotation.y = Math.PI / 2;
    }

    // Salto (Gravedad simple)
    if (keys['Space'] && player.position.y <= 1.1) {
        player.velocityY = 12;
    }
    player.velocityY = (player.velocityY || 0) - 30 * delta;
    player.position.y += player.velocityY * delta;
    if (player.position.y < 1) {
        player.position.y = 1;
        player.velocityY = 0;
    }

    // Límites del escenario
    player.position.x = Math.max(-40, Math.min(40, player.position.x));

    // Cámara sigue al jugador (Vista Acostada)
    // Mantiene la cámara a 12 unidades a la derecha y 6 de altura
    camera.position.x += (player.position.x + 12 - camera.position.x) * 0.1;
    camera.position.z += (0 - camera.position.z) * 0.1;
    camera.lookAt(player.position.x, player.position.y + 1, 0);

    // Enemigos persiguen
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const dir = new THREE.Vector3().subVectors(player.position, e.position);
        dir.y = 0;
        dir.normalize();
        e.position.add(dir.multiplyScalar(e.speed));

        // Daño al jugador
        if (e.position.distanceTo(player.position) < 2) {
            playerHp -= 10 * delta * 10;
            if (playerHp <= 0) {
                playerHp = 100; // Reinicio simple
                player.position.set(0, 1, 0);
                showMsg("¡Has sido derrotado!");
            }
        }
    }

    // Balas
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.position.add(b.velocity);
        // Colisión con enemigos
        for (let j = enemies.length - 1; j >= 0; j--) {
            if (b.position.distanceTo(enemies[j].position) < 1.5) {
                scene.remove(enemies[j]);
                enemies.splice(j, 1);
                scene.remove(b);
                bullets.splice(i, 1);
                playerXp += 25;
                if (playerXp >= playerXpMax) {
                    playerXp -= playerXpMax;
                    playerLevel++;
                    playerXpMax = Math.floor(playerXpMax * 1.5);
                    showMsg("¡Subiste de nivel!");
                }
                updateUI();
                break;
            }
        }
        // Eliminar balas lejanas
        if (Math.abs(b.position.x) > 60) {
            scene.remove(b);
            bullets.splice(i, 1);
        }
    }

    // Frutas
    for (let i = fruits.length - 1; i >= 0; i--) {
        const f = fruits[i];
        f.rotation.y += 0.05;
        f.position.y = 1.5 + Math.sin(Date.now() * 0.005) * 0.3;
        
        if (f.position.distanceTo(player.position) < 2) {
            scene.remove(f);
            fruits.splice(i, 1);
            fruitCount++;
            showMsg("¡Fruta obtenida!");
            updateUI();
            spawnFruit();
        }
    }

    // Spawns periódicos
    if (Math.random() < 0.01) spawnEnemy();
    if (Math.random() < 0.005) spawnFruit();
}

function showMsg(text) {
    const el = document.getElementById('missionText');
    el.innerText = text;
    setTimeout(() => el.innerText = "Recoge 2 frutas", 2000);
}

// Bucle de renderizado
function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.1);

    if (isPlaying) {
        updateGame(delta);
    }

    renderer.render(scene, camera);
}

// Arrancar todo al cargar
init();
</script>
</body>
</html>
