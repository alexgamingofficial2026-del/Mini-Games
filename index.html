<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blox Fruits - Dragon LVL 0 a 2800</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Trebuchet MS', sans-serif; }
  body { overflow: hidden; background: #87CEEB; width: 100vw; height: 100vh; touch-action: none; }
  
  /* ===== PANTALLA DE SELECCIÓN ===== */
  #menu-screen {
    position: fixed; inset: 0; z-index: 100;
    background: linear-gradient(135deg, #2c3e50, #000);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.5s;
  }
  .menu-title { background: rgba(0,0,0,0.8); color: white; padding: 10px 40px; font-size: 24px; font-weight: bold; border-radius: 8px; margin-bottom: 20px; border: 2px solid #ff0000; }
  .cards-container { display: flex; gap: 20px; align-items: center; justify-content: center; width: 90%; max-width: 800px; }
  .card {
    width: 45%; max-width: 300px; border: 4px solid; border-radius: 10px;
    display: flex; flex-direction: column; cursor: pointer; transition: transform 0.2s;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8); background: #111;
  }
  .card:hover { transform: scale(1.05); }
  .card-pirate { border-color: #ff3333; }
  .card-marine { border-color: #3388ff; }
  .card-header { height: 150px; background-size: cover; background-position: center; border-bottom: 2px solid #333; }
  .card-title { font-size: 24px; font-weight: 900; color: white; text-align: center; text-shadow: 2px 2px 0 #000; padding: 10px 0; }
  .vs-text { font-size: 36px; font-weight: 900; color: white; text-shadow: 2px 2px 0 #000; font-style: italic; }

  /* ===== HUD DE JUEGO ===== */
  #game-ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: none; }
  
  .top-bar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; }
  .menu-btn { background: #ffcc00; color: #000; font-weight: bold; border: 2px solid #fff; border-radius: 4px; padding: 5px 20px; font-size: 14px; box-shadow: 0 2-betweenpx 5px #000; }
  
  /* Info; Jugador */
  .player-info align-items: { position: absolute; top: center 50px; left: 15px; display: flex; flex-direction: column; gap: 4px; text-shadow: 2px 2px 0 #000; }
  .level-txt { color: white; font-size: 18px; font-weight: bold; }
  .xp-bar-bg { width: 160px; height: 12px; background: #222; border: 2px solid #000; border-radius: 4px; position: relative; overflow: hidden; }
  .xp-bar-fill { width: 0%; height: 100%; background: #a000ff; transition: width 0.2s; }
  .xp-text { position: absolute; top: -2px; width: 100%; text-align: center; font-size: 9px; color: white; font-weight: bold; }
  .money-txt { color: #00ff00; font-size: 18px; font-weight: bold; }

  /* Barras Salud / Energía */
  .stats-container { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; width: 90%; max-width: 450px; }
  .stat-bar { flex: 1; height: 28px; border: 2px solid #000; border-radius: 4px; position: relative; background: #333; box-shadow: 0 3px 0 #000; overflow: hidden; }
  .health-fill { width: 100%; height: 100%; background: #33ff33; transition: width 0.2s; }
  .energy-fill { width: 100%; height: 100%; background: #33ffff; transition: width 0.2s; }
  .stat-text { position: absolute; inset: 0; display: flex; justify-content: space; padding: 0 8px; color: white; font-size: 12px; font-weight: bold; text-shadow: 1px 1px 0 #000; }

  /* Habilidades */
  .skills-container { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; }
  .skill-slot { width: 50px; height: 50px; background: #222; border: 2px solid #555; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 3px 0 #000; }
  .skill-slot.active { border-color: #fff; background: #444; box-shadow: 0 0 10px #fff; }

  /* Joystick */
  .joystick-area { position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; pointer-events: auto; }
  .joystick-knob { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.8); border-radius: 50%; }
  
  /* Botón Salto / Dragón */
  .action-btns { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 15px; pointer-events: auto; }
  .jump-btn, .dragon-btn { width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 30px; box-shadow: 0 4px 0 rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.6); cursor: pointer; }
  .jump-btn { background: rgba(0,0,0,0.4); }
  .dragon-btn { background: rgba(255, 68, 0, 0.6); font-size: 36px; }
  .jump-btn:active, .dragon-btn:active { transform: translateY(4px); box-shadow: none; }

  #notification { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 25px; border-radius: 20px; font-size: 18px; font-weight: bold; opacity: 0; transition: opacity 0.5s; pointer-events: none; border: 2px solid #ff0000; text-align: center; }
</style>
</head>
<body>

<div id="menu-screen">
  <div class="menu-title">Pick A Side!</div>
  <div class="cards-container">
    <div class="card card-pirate" onclick="startGame('Piratas')">
      <div class="card-header" style="background-image: url('https://tr.rbxcdn.com/180DAY-7b96ff082e900c48d01017011316fdb9/420/420/Image/Png/noFilter');"></div>
      <div class="card-title">PIRATAS</div>
    </div>
    <div class="vs-text">VS</div>
    <div class="card card-marine" onclick="startGame('Marinas')">
      <div class="card-header" style="background-image: url('https://tr.rbxcdn.com/180DAY-8f5b75f9c0e6c2f3a5c9455fb0b4f1a1/420/420/Image/Png/noFilter');"></div>
      <div class="card-title">MARINAS</div>
    </div>
  </div>
</div>

<div id="game-ui">
  <div class="top-bar"><div class="menu-btn">Menú</div></div>
  
  <div class="player-info">
    <div class="level-txt" id="lvl-text">Lv. 0 / 2800</div>
    <div class="xp-bar-bg">
      <div class="xp-bar-fill" id="xp-fill"></div>
      <div class="xp-text" id="xp-text">0 / 100 XP</div>
    </div>
    <div class="money-txt" id="money-text">$ 0</div>
  </div>

  <div id="notification"></div>

  <div class="stats-container">
    <div class="stat-bar">
      <div class="health-fill" id="hp-fill"></div>
      <div class="stat-text"><span>Salud</span><span id="hp-val">100/100</span></div>
    </div>
    <div class="stat-bar">
      <div class="energy-fill" id="en-fill"></div>
      <div class="stat-text"><span>Energy</span><span id="en-val">100/100</span></div>
    </div>
  </div>

  <div class="skills-container">
    <div class="skill-slot active" style="color:#00ffff;">✋</div>
    <div class="skill-slot" style="color:#ff00ff;">☠️</div>
    <div class="skill-slot" id="dragon-skill" style="color:#ff4400; opacity:0.3;">🐉</div>
    <div class="skill-slot">⚔️</div>
    <div class="skill-slot">➕</div>
  </div>

  <div class="joystick-area" id="joystick">
    <div class="joystick-knob" id="knob"></div>
  </div>
  
  <div class="action-btns">
    <div class="dragon-btn" id="dragon-btn">🐉</div>
    <div class="jump-btn" id="jump-btn">▲</div>
  </div>
</div>

<!-- Three.js Clásico -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

<script>
let scene, camera, renderer, player, clock;
let state = {
  playing: false,
  lvl: 0,
  maxLvl: 2800,
  xp: 0,
  xpNext: 100,
  money: 0,
  hp: 100,
  maxHp: 100,
  en: 100,
  maxEn: 100,
  hasDragon: false,
  // Movimiento
  x: 0, z: 0, y: 0, rotY: 0,
  velY: 0, isJumping: false,
  joyX: 0, joyY: 0
};

// Inicializar Three.js
function init3D() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.Fog(0x87CEEB, 50, 150);

  camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
  camera.position.set(0, 15, 15);
  camera.lookAt(0, 2, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  // Luces
  const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 1.5);
  sun.position.set(20, 40, 20);
  sun.castShadow = true;
  sun.shadow.camera.left = -50; sun.shadow.camera.right = 50;
  sun.shadow.camera.top = 50; sun.shadow.camera.bottom = -50;
  scene.add(sun);

  // Suelo
  const floorGeo = new THREE.PlaneGeometry(200, 200);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x7cba5c });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // Camino de tierra
  const pathGeo = new THREE.PlaneGeometry(200, 20);
  const pathMat = new THREE.MeshStandardMaterial({ color: 0xd4b88a });
  const path = new THREE.Mesh(pathGeo, pathMat);
  path.rotation.x = -Math.PI / 2;
  path.position.y = 0.01;
  path.receiveShadow = true;
  scene.add(path);

  // Generar Edificios (estilo bloques)
  const colors = [0xff9999, 0x99ff99, 0x9999ff, 0xffff99, 0xffcc99];
  for(let i=0; i<15; i++) {
    let w = 5 + Math.random() * 8, h = 10 + Math.random() * 15, d = 5 + Math.random() * 8;
    let x = (Math.random() - 0.5) * 80;
    let z = (Math.random() - 0.5) * 80;
    if (Math.abs(x) < 15 && Math.abs(z) < 15) { x += x > 0 ? 20 : -20; }
    
    const bGeo = new THREE.BoxGeometry(w, h, d);
    const bMat = new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random()*colors.length)] });
    const b = new THREE.Mesh(bGeo, bMat);
    b.position.set(x, h/2, z);
    b.castShadow = true;
    b.receiveShadow = true;
    scene.add(b);
    
    // Tejado
    const rGeo = new THREE.ConeGeometry(w * 0.8, 4, 4);
    const rMat = new THREE.MeshStandardMaterial({ color: 0x880000 });
    const r = new THREE.Mesh(rGeo, rMat);
    r.position.set(x, h + 2, z);
    r.rotation.y = Math.PI / 4;
    r.castShadow = true;
    scene.add(r);
  }

  // Crear Personaje (Estilo la foto)
  player = new THREE.Group();
  
  const torso = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2, 0.8), new THREE.MeshStandardMaterial({ color: 0x00ff00 }));
  torso.position.y = 2; torso.castShadow = true; player.add(torso);

  const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({ color: 0xffcc99 }));
  head.position.y = 3.8; head.castShadow = true; player.add(head);

  const hair = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.5, 1.25), new THREE.MeshStandardMaterial({ color: 0x111111 }));
  hair.position.y = 4.2; hair.position.z = 0.05; player.add(hair);

  // Capa de piel
  const cape = new THREE.Mesh(new THREE.CylinderGeometry(1, 1.2, 0.8, 8), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  cape.position.y = 2.8; cape.castShadow = true; player.add(cape);

  const legGeo = new THREE.BoxGeometry(0.6, 1.8, 0.6);
  const legMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
  const legL = new THREE.Mesh(legGeo, legMat); legL.position.set(-0.4, 0.9, 0); legL.castShadow = true; player.add(legL);
  const legR = new THREE.Mesh(legGeo, legMat); legR.position.set(0.4, 0.9, 0); legR.castShadow = true; player.add(legR);

  const armGeo = new THREE.BoxGeometry(0.5, 1.8, 0.5);
  const armMat = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
  const armL = new THREE.Mesh(armGeo, armMat); armL.position.set(-1.1, 2, 0); armL.castShadow = true; player.add(armL);
  const armR = new THREE.Mesh(armGeo, armMat); armR.position.set(1.1, 2, 0); armR.castShadow = true; player.add(armR);

  player.userData = { legL, legR, armL, armR };
  scene.add(player);

  // CREAR LA FRUTA DRAGÓN EN EL SUELO
  const dragonFruit = new THREE.Group();
  const dfBase = new THREE.Mesh(new THREE.IcosahedronGeometry(0.8, 1), new THREE.MeshStandardMaterial({ color: 0xff4400, emissive: 0xff2200, emissiveIntensity: 1 }));
  dragonFruit.add(dfBase);
  // Espinas falsas
  for(let i=0; i<8; i++){
     const spike = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.6, 4), new THREE.MeshStandardMaterial({ color: 0x228822 }));
     spike.position.set(Math.cos(i)*0.8, Math.sin(i)*0.8, 0);
     spike.rotation.z = Math.atan2(spike.position.y, spike.position.x) - Math.PI/2;
     dragonFruit.add(spike);
  }
  dragonFruit.position.set(5, 1, 5);
  scene.add(dragonFruit);
  player.userData.dragonFruit = dragonFruit;
  
  // Luz de la fruta
  const fLight = new THREE.PointLight(0xff4400, 2, 10);
  fLight.position.set(5, 1, 5);
  scene.add(fLight);
  player.userData.fLight = fLight;

  clock = new THREE.Clock();
  requestAnimationFrame(animate);
  updateUI();
}

// Bucle de juego
function animate() {
  requestAnimationFrame(animate);
  if (!state.playing) return;
  
  const dt = Math.min(clock.getDelta(), 0.1);
  const time = clock.getElapsedTime();

  // Movimiento
  let mx = state.joyX, mz = -state.joyY;
  let isMoving = false;
  if (Math.abs(mx) > 0.1 || Math.abs(mz) > 0.1) {
    isMoving = true;
    // Rotar personaje hacia el movimiento
    const angle = Math.atan2(mx, mz);
    let diff = angle - player.rotation.y;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    player.rotation.y += diff * dt * 10;

    // Mover
    const speed = 8;
    player.position.x += Math.sin(player.rotation.y) * speed * dt;
    player.position.z += Math.cos(player.rotation.y) * speed * dt;
  }

  // Animación
  const legL = player.userData.legL, legR = player.userData.legR;
  const armL = player.userData.armL, armR = player.userData.armR;
  if (isMoving) {
    const swing = Math.sin(time * 12) * 0.5;
    legL.rotation.x = swing; legR.rotation.x = -swing;
    armL.rotation.x = -swing; armR.rotation.x = swing;
  } else {
    legL.rotation.x *= 0.8; legR.rotation.x *= 0.8;
    armL.rotation.x *= 0.8; armR.rotation.x *= 0.8;
  }

  // Salto
  if (state.isJumping) {
    state.velY -= 30 * dt;
    player.position.y += state.velY * dt;
    if (player.position.y <= 0) { player.position.y = 0; state.isJumping = false; state.velY = 0; }
  }

  // Rotar fruta dragón
  const df = player.userData.dragonFruit;
  if (df && df.visible) {
    df.rotation.y += dt * 2;
    df.position.y = 1 + Math.sin(time * 3) * 0.2;
    player.userData.fLight.position.copy(df.position);
    
    // Recoger fruta
    const dist = Math.hypot(player.position.x - df.position.x, player.position.z - df.position.z);
    if (dist < 2) {
      df.visible = false;
      player.userData.fLight.visible = false;
      state.hasDragon = true;
      document.getElementById('dragon-skill').style.opacity = '1';
      showNotif("¡Has obtenido la Fruta Dragón! 🐉");
    }
  }

  // Cámara (Tercera persona fija)
  const camOffset = new THREE.Vector3(0, 12, 14);
  camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
  camera.position.lerp(player.position.clone().add(camOffset), dt * 5);
  camera.lookAt(player.position.x, player.position.y + 2, player.position.z);

  renderer.render(scene, camera);
}

// Lógica de UI y Niveles
function addXP(amount) {
  if (state.lvl >= state.maxLvl) return;
  state.xp += amount;
  while (state.xp >= state.xpNext && state.lvl < state.maxLvl) {
    state.xp -= state.xpNext;
    state.lvl++;
    state.xpNext = Math.floor(100 * Math.pow(1.05, state.lvl));
    state.maxHp += 50; state.hp = state.maxHp;
    state.maxEn += 30; state.en = state.maxEn;
  }
  if (state.lvl >= state.maxLvl) state.xp = 0;
  updateUI();
}

function updateUI() {
  document.getElementById('lvl-text').innerText = `Lv. ${state.lvl} / ${state.maxLvl}`;
  document.getElementById('money-text').innerText = `$ ${state.money.toLocaleString()}`;
  
  const xpPct = state.lvl >= state.maxLvl ? 100 : (state.xp / state.xpNext) * 100;
  document.getElementById('xp-fill').style.width = xpPct + '%';
  document.getElementById('xp-text').innerText = state.lvl >= state.maxLvl ? 'MAX' : `${state.xp} / ${state.xpNext} XP`;
  
  document.getElementById('hp-fill').style.width = (state.hp / state.maxHp * 100) + '%';
  document.getElementById('hp-val').innerText = `${state.hp}/${state.maxHp}`;
  document.getElementById('en-fill').style.width = (state.en / state.maxEn * 100) + '%';
  document.getElementById('en-val').innerText = `${state.en}/${state.maxEn}`;
}

function showNotif(txt) {
  const n = document.getElementById('notification');
  n.innerHTML = txt;
  n.style.opacity = '1';
  setTimeout(() => n.style.opacity = '0', 3000);
}

// Controles
const joystick = document.getElementById('joystick');
const knob = document.getElementById('knob');
let joyActive = false, center = {x:0, y:0}, maxDist = 40;

function joyStart(e) {
  joyActive = true;
  const r = joystick.getBoundingClientRect();
  center = {x: r.left + r.width/2, y: r.top + r.height/2};
  if(e.type==='touchstart') e.preventDefault();
}
function joyMove(e) {
  if(!joyActive) return;
  if(e.type==='touchmove') e.preventDefault();
  let cx = e.touches ? e.touches[0].clientX : e.clientX;
  let cy = e.touches ? e.touches[0].clientY : e.clientY;
  let dx = cx - center.x, dy = cy - center.y;
  const dist = Math.hypot(dx, dy);
  if(dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  state.joyX = dx/maxDist; state.joyY = dy/maxDist;
}
function joyEnd() {
  joyActive = false;
  knob.style.transform = `translate(0px, 0px)`;
  state.joyX = 0; state.joyY = 0;
}
joystick.addEventListener('mousedown', joyStart); document.addEventListener('mousemove', joyMove); document.addEventListener('mouseup', joyEnd);
joystick.addEventListener('touchstart', joyStart, {passive:false}); document.addEventListener('touchmove', joyMove, {passive:false}); document.addEventListener('touchend', joyEnd);

// Teclado
const keys = {w:0,a:0,s:0,d:0};
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if(keys.hasOwnProperty(k)) keys[k] = 1;
  if(e.code === 'Space' && !state.isJumping) { state.velY = 12; state.isJumping = true; }
});
document.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if(keys.hasOwnProperty(k)) keys[k] = 0;
});
setInterval(() => {
  if(!state.playing) return;
  let kx = (keys.d - keys.a), ky = (keys.s - keys.w);
  if(kx !== 0 || ky !== 0) { state.joyX = kx; state.joyY = ky; }
  else if(!joyActive) { state.joyX = 0; state.joyY = 0; }
}, 20);

// Botones
document.getElementById('jump-btn').addEventListener('touchstart', (e) => { e.preventDefault(); if(!state.isJumping){state.velY=12; state.isJumping=true;} });
document.getElementById('jump-btn').addEventListener('mousedown', () => { if(!state.isJumping){state.velY=12; state.isJumping=true;} });

// Usar Dragón
document.getElementById('dragon-btn').addEventListener('mousedown', () => useDragon());
document.getElementById('dragon-btn').addEventListener('touchstart', (e) => { e.preventDefault(); useDragon(); }, {passive:false});

function useDragon() {
  if (!state.hasDragon) return;
  showNotif("¡FUEGO DE DRAGÓN! 🐉🔥");
  // Efecto visual rápido
  const df = new THREE.Mesh(new THREE.SphereGeometry(3, 16, 16), new THREE.MeshBasicMaterial({ color: 0xff4400, transparent: true, opacity: 0.6 }));
  df.position.copy(player.position); df.position.y = 2;
  scene.add(df);
  
  let s = 1;
  const anim = setInterval(() => {
    s += 0.1; df.scale.set(s, s, s);
    df.material.opacity -= 0.05;
    if (df.material.opacity <= 0) { clearInterval(anim); scene.remove(df); }
  }, 30);
  
  // Subir de nivel (simular XP por usar fruta)
  addXP(50);
}

// Iniciar juego
function startGame(faction) {
  document.getElementById('menu-screen').style.opacity = '0';
  setTimeout(() => document.getElementById('menu-screen').style.display = 'none', 500);
  document.getElementById('game-ui').style.display = 'block';
  
  showNotif(`Unido al equipo de <${faction}>`);
  
  state.playing = true;
  clock = new THREE.Clock(); // Reiniciar reloj
  
  // Simular ganancia de dinero pasiva
  setInterval(() => {
    if(!state.playing) return;
    state.money += 50;
    updateUI();
  }, 2000);
}

// Iniciar Three.js
window.onload = () => {
  if (typeof THREE === 'undefined') {
    document.body.innerHTML += "<h2 style='color:white;text-align:center;margin-top:20px;'>Error cargando Three.js. Revisa tu conexión a internet.</h2>";
    return;
  }
  init3D();
};

window.addEventListener('resize', () => {
  if(camera && renderer) {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  }
});
