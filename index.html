<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blox Fruits - 3D Realista & Dragón</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Trebuchet MS', sans-serif; }
  body { overflow: hidden; background: #000; width: 100vw; height: 100vh; touch-action: none; }
  
  /* MENÚ DE INICIO */
  #menu {
    position: fixed; inset: 0; z-index: 100;
    background: url('https://images.unsplash.com/photo-1505118380757-91f5f5632de0?q=80&w=2000&auto=format&fit=crop') center/cover;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #menu::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.6); }
  .menu-box {
    position: relative; z-index: 2; text-align: center;
    background: rgba(10,20,30,0.8); padding: 40px 60px; border-radius: 15px;
    border: 2px solid #00ffff; box-shadow: 0 0 50px rgba(0,255,255,0.3);
  }
  .menu-box h1 { color: #fff; font-size: 40px; text-shadow: 0 0 20px #00ffff; margin-bottom: 10px; }
  .menu-box p { color: #aaa; margin-bottom: 30px; }
  .menu-btn {
    background: linear-gradient(45deg, #00ffff, #0088ff); border: none;
    padding: 15px 40px; font-size: 20px; font-weight: bold; color: #000;
    border-radius: 8px; cursor: pointer; text-transform: uppercase;
    box-shadow: 0 5px 15px rgba(0,255,255,0.4); transition: 0.2s;
  }
  .menu-btn:hover { transform: scale(1.05); }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: none; }
  
  .top-left { position: absolute; top: 20px; left: 20px; text-shadow: 2px 2px 4px #000; }
  .lvl-text { color: #fff; font-size: 24px; font-weight: bold; }
  .xp-bg { width: 200px; height: 14px; background: rgba(0,0,0,0.7); border: 2px solid #333; border-radius: 7px; margin-top: 5px; overflow: hidden; position: relative; }
  .xp-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #a000ff, #ff00ff); transition: width 0.3s; }
  .xp-txt { position: absolute; inset: 0; text-align: center; font-size: 10px; color: white; line-height: 10px; font-weight: bold; }
  .money-text { color: #00ff00; font-size: 20px; font-weight: bold; margin-top: 5px; }

  .bottom-center { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; }
  .bars { display: flex; gap: 10px; margin-bottom: 10px; }
  .bar { flex: 1; height: 30px; background: rgba(0,0,0,0.7); border: 2px solid #222; border-radius: 5px; position: relative; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
  .hp-fill { width: 100%; height: 100%; background: linear-gradient(180deg, #55ff55, #00aa00); transition: width 0.3s; }
  .en-fill { width: 100%; height: 100%; background: linear-gradient(180deg, #55ffff, #0088ff); transition: width 0.3s; }
  .bar-txt { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; color: #fff; font-size: 12px; font-weight: bold; text-shadow: 1px 1px 2px #000; }

  .skills { display: flex; gap: 5px; justify-content: center; }
  .slot { width: 50px; height: 50px; background: rgba(0,0,0,0.7); border: 2px solid #444; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .slot.active { border-color: #00ffff; box-shadow: 0 0 15px #00ffff; background: rgba(0,255,255,0.2); }

  /* Controles Táctiles */
  .joystick { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; pointer-events: auto; }
  .knob { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; background: rgba(0,255,255,0.5); border: 2px solid #fff; border-radius: 50%; }
  
  .actions { position: absolute; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 15px; pointer-events: auto; }
  .btn { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.5); cursor: pointer; }
  .btn-jump { background: rgba(0,150,255,0.6); }
  .btn-dragon { background: rgba(255,68,0,0.8); border-color: #ffaa00; display: none; }
  .btn-dragon.active { display: flex; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,68,0,0.7); } 70% { box-shadow: 0 0 0 20px rgba(255,68,0,0); } 100% { box-shadow: 0 0 0 0 rgba(255,68,0,0); } }

  /* Fruta en el suelo */
  #fruit-prompt { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); color: #ff4400; font-size: 24px; font-weight: bold; text-shadow: 0 0 10px #000; display: none; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 10px; border: 2px solid #ff4400; }
</style>
</head>
<body>

<div id="menu">
  <div class="menu-box">
    <h1>BLOX FRUITS 3D</h1>
    <p>Encuentra la Fruta Dragón y domina el cielo</p>
    <button class="menu-btn" onclick="startGame()">ENTRAR AL MUNDO</button>
  </div>
</div>

<div id="hud">
  <div class="top-left">
    <div class="lvl-text" id="ui-lvl">Lv. 0 / 2800</div>
    <div class="xp-bg"><div class="xp-fill" id="ui-xp"></div><div class="xp-txt" id="ui-xp-txt">0 / 100 XP</div></div>
    <div class="money-text" id="ui-money">$ 0</div>
  </div>

  <div id="fruit-prompt">¡Has obtenido la Fruta Dragón! 🐉</div>

  <div class="bottom-center">
    <div class="bars">
      <div class="bar"><div class="hp-fill" id="ui-hp"></div><div class="bar-txt"><span>Salud</span><span id="ui-hp-val">1000/1000</span></div></div>
      <div class="bar"><div class="en-fill" id="ui-en"></div><div class="bar-txt"><span>Energy</span><span id="ui-en-val">1000/1000</span></div></div>
    </div>
    <div class="skills">
      <div class="slot active" style="color:#00ffff;">✋</div>
      <div class="slot" style="color:#ff00ff;">☠️</div>
      <div class="slot" id="ui-slot-dragon" style="color:#ff4400; opacity:0.3;">🐉</div>
      <div class="slot">⚔️</div>
    </div>
  </div>

  <div class="joystick" id="joy"><div class="knob" id="knob"></div></div>
  <div class="actions">
    <div class="btn btn-dragon" id="btn-dragon" onclick="useDragon()">🐉</div>
    <div class="btn btn-jump" id="btn-jump" onclick="jump()">▲</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// Variables globales
let scene, camera, renderer, clock;
let player, playerMixer;
let dragonFruit, dragonModel, dragonMixer;
let fireParticles = [];
let isFruitCollected = false;
let isDragonActive = false;

// Estado del jugador
const S = {
  playing: false, lvl: 0, maxLvl: 2800, xp: 0, xpNext: 100, money: 0,
  hp: 1000, maxHp: 1000, en: 1000, maxEn: 1000,
  velY:Mapping 0, isJumping: false, isMoving: false,
  joyX: 0, joyY: 0
};

// Iniciar
window.startGame = function() {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  S.playing = true;
  clock = new THREE.Clock();
  animate();
};

// Configurar Escena 3D Realista
function initScene() {
  scene = new THREE.Scene();
  // Cielo realista (atardecer)
  scene.background = new THREE.Color(0x1a2b3c);
  scene.fog = new THREE.FogExp2(0x1a2b3c, 0.005);

  camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneExposure = 1.2;
  document.body.appendChild(renderer.domElement);

  // Luces
  const hemi = new THREE.HemisphereLight(0x88bbff, 0x443322, 1.0);
  scene.add(hemi);
  
  const sun = new THREE.DirectionalLight(0xffddbb, 2);
  sun.position.set(50, 100, 50);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 2048;
  sun.shadow.mapSize.height = 2048;
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 500;
  sun.shadow.camera.left = -100;
  sun.shadow.camera.right = 100;
  sun.shadow.camera.top = 100;
  sun.shadow.camera.bottom = -100;
  scene.add(sun);

  // Agua Realista (Textura animada procedural)
  const waterGeo = new THREE.PlaneGeometry(2000, 2000, 64, 64);
  const waterMat = new THREE.MeshStandardMaterial({
    color: 0x004488, roughness: 0.1, metalness: 0.8, transparent: true, opacity: 0.9
  });
  const water = new THREE.Mesh(waterGeo, waterMat);
  water.rotation.x = -Math.PI / 2;
  water.position.y = -1;
  water.receiveShadow = true;
  scene.add(water);

  // Isla de Arena
  const islandGeo = new THREE.CylinderGeometry(40, 45, 4, 32);
  const islandMat = new THREE.MeshStandardMaterial({ color: 0xd4b88a, roughness: 0.9 });
  const island = new THREE.Mesh(islandGeo, islandMat);
  island.position.y = 0;
  island.receiveShadow = true;
  scene.add(island);

  // Cargar Modelos GLTF (.glb)
  const loader = new GLTFLoader();

  // 1. Cargar Personaje
  loader.load('https://threejs.org/examples/models/gltf/Soldier.glb', (gltf) => {
    player = gltf.scene;
    player.traverse(child => { if(child.isMesh) child.castShadow = true; });
    player.position.set(0, 1, 0);
    player.scale.set(1.5, 1.5, 1.5); // Hacerlo más grande
    scene.add(player);
    
    // Animaciones
    playerMixer = new THREE.AnimationMixer(player);
    const idle = playerMixer.clipAction(gltf.animations[0]); // Idle
    const walk = playerMixer.clipAction(gltf.animations[1]); // Walk
    idle.play();
    player.userData.idle = idle;
    player.userData.walk = walk;
  });

  // 2. Cargar Dragón (Fruta en el suelo)
  dragonFruit = new THREE.Group();
  dragonFruit.position.set(10, 1, -10);
  
  // Esfera base de la fruta
  const fruitMesh = new THREE.Mesh(
    new THREE.IcosahedronGeometry(1, 2),
    new THREE.MeshPhysicalMaterial({ color: 0xff2200, roughness: 0.2, metalness: 0.1, clearcoat: 1.0, emissive: 0x441100 })
  );
  dragonFruit.add(fruitMesh);
  
  // Efecto de luz en la fruta
  const fLight = new THREE.PointLight(0xff4400, 3, 15);
  fLight.position.set(0, 1, 0);
  dragonFruit.add(fLight);
  scene.add(dragonFruit);

  // Cargar modelo de Dragón (Oculto inicialmente)
  loader.load('https://threejs.org/examples/models/gltf/DragonAttenuation.glb', (gltf) => {
    dragonModel = gltf.scene;
    // Hacer al dragón ENORME y realista
    dragonModel.scale.set(3, 3, 3);
    dragonModel.position.set(0, 20, -30);
    dragonModel.visible = false; // Oculto hasta obtener la fruta
    dragonModel.traverse(child => { if(child.isMesh) child.castShadow = true; });
    scene.add(dragonModel);

    dragonMixer = new THREE.AnimationMixer(dragonModel);
    if (gltf.animations.length > 0) {
      const flyAnim = dragonMixer.clipAction(gltf.animations[0]);
      flyAnim.play();
    }
  });

  // Partículas de fuego
  const fireGeo = new THREE.BufferGeometry();
  const fireCount = 500;
  const firePos = new Float32Array(fireCount * 3);
  fireGeo.setAttribute('position', new THREE.BufferAttribute(firePos, 3));
  const fireMat = new THREE.PointsMaterial({ color: 0xff4400, size: 0.5, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
  const fireParticlesMesh = new THREE.Points(fireGeo, fireMat);
  scene.add(fireParticlesMesh);
  scene.userData.fireParticles = fireParticlesMesh;
  scene.userData.firePos = firePos;

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

// Bucle de animación
let timeAcc = 0;
function animate() {
  if (!S.playing) return;
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.1);
  const time = clock.getElapsedTime();
  timeAcc += dt;

  if (playerMixer) playerMixer.update(dt);
  if (dragonMixer) dragonMixer.update(dt);

  // Mover al jugador
  if (player) {
    let mx = S.joyX, mz = -S.joyY;
    S.isMoving = Math.abs(mx) > 0.1 || Math.abs(mz) > 0.1;

    if (S.isMoving) {
      const angle = Math.atan2(mx, mz);
      let diff = angle - player.rotation.y;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      player.rotation.y += diff * dt * 10;

      const speed = 15;
      player.position.x += Math.sin(player.rotation.y) * speed * dt;
      player.position.z += Math.cos(player.rotation.y) * speed * dt;

      // Animación caminar
      if (player.userData.walk && !player.userData.walk.isRunning()) {
        player.userData.idle.stop();
        player.userData.walk.play();
      }
    } else {
      if (player.userData.idle && !player.userData.idle.isRunning()) {
        player.userData.walk.stop();
        player.userData.idle.play();
      }
    }

    // Salto
    if (S.isJumping) {
      S.velY -= 40 * dt;
      player.position.y += S.velY * dt;
      if (player.position.y <= 1) { player.position.y = 1; S.isJumping = false; S.velY = 0; }
    }

    // Cámara tercera persona (Suave)
    const camOffset = new THREE.Vector3(0, 8, 15);
    camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
    const targetCamPos = player.position.clone().add(camOffset);
    camera.position.lerp(targetCamPos, dt * 3);
    camera.lookAt(player.position.x, player.position.y + 3, player.position.z);

    // Colisión Fruta
    if (dragonFruit && !isFruitCollected) {
      dragonFruit.rotation.y += dt * 2;
      dragonFruit.position.y = 2 + Math.sin(time * 2) * 0.5;
      
      const dist = player.position.distanceTo(dragonFruit.position);
      if (dist < 4) {
        isFruitCollected = true;
        scene.remove(dragonFruit);
        document.getElementById('fruit-prompt').style.display = 'block';
        setTimeout(() => document.getElementById('fruit-prompt').style.display = 'none', 3000);
        
        // Activar UI Dragón
        document.getElementById('btn-dragon').classList.add('active');
        document.getElementById('ui-slot-dragon').style.opacity = '1';
        
        if (dragonModel) dragonModel.visible = true;
      }
    }

    // Movimiento del Dragón volador
    if (isFruitCollected && dragonModel) {
      // El dragón sobrevuela en círculos
      const r = 25;
      const dx = Math.cos(time * 0.5) * r;
      const dz = Math.sin(time * 0.5) * r;
      dragonModel.position.set(player.position.x + dx, 20, player.position.z + dz);
      dragonModel.rotation.y = -time * 0.5 + Math.PI/2;
      
      // Dejar estela de fuego
      if (Math.random() < 0.3) {
        spawnFire(dragonModel.position.x, dragonModel.position.y, dragonModel.position.z);
      }
    }

    // Animar Agua (Olas simples)
    const waterMesh = scene.children.find(c => c.geometry?.type === 'PlaneGeometry' && c.position.y === -1);
    if (waterMesh) {
      const positions = waterMesh.geometry.attributes.position;
      for(let i=0; i<positions.count; i++) {
        positions.setZ(i, Math.sin(i * 0.1 + time) * 2);
      }
      positions.needsUpdate = true;
    }
  }

  // Partículas de fuego
  updateFire(dt);

  renderer.render(scene, camera);
}

// Sistema de partículas de fuego
let fireIdx = 0;
function spawnFire(x, y, z) {
  const mesh = scene.userData.fireParticles;
  const pos = scene.userData.firePos;
  pos[fireIdx * 3] = x + (Math.random()-0.5)*5;
  pos[fireIdx * 3 + 1] = y + (Math.random()-0.5)*5;
  pos[fireIdx * 3 + 2] = z + (Math.random()-0.5)*5;
  fireIdx = (fireIdx + 1) % 500;
  mesh.geometry.attributes.position.needsUpdate = true;
}

function updateFire(dt) {
  const mesh = scene.userData.fireParticles;
  const pos = scene.userData.firePos;
  for(let i=0; i<500; i++) {
    // Hacer que caigan
    pos[i*3+1] -= 10 * dt;
    if (pos[i*3+1] < 0) pos[i*3+1] = -100; // Ocultar bajo tierra
  }
  mesh.geometry.attributes.position.needsUpdate = true;
}

// Habilidad Dragón
window.useDragon = function() {
  if (!isFruitCollected) return;
  
  // Efecto visual explosivo (Onda de fuego)
  for(let i=0; i<50; i++) {
    spawnFire(player.position.x, player.position.y+2, player.position.z);
  }
  
  // Hacer que el dragón se acerque y escupa fuego
  if(dragonModel) {
    dragonModel.position.set(player.position.x, 10, player.position.z - 10);
    for(let i=0; i<200; i++) {
      spawnFire(player.position.x, player.position.y+2, player.position.z);
    }
  }

  addXP(150); // Subir XP
  S.en -= 100;
  updateHUD();
};

// Subir de Nivel
function addXP(amount) {
  if (S.lvl >= S.maxLvl) return;
  S.xp += amount;
  while (S.xp >= S.xpNext && S.lvl < S.maxLvl) {
    S.xp -= S.xpNext;
    S.lvl++;
    S.xpNext = Math.floor(100 * Math.pow(1.05, S.lvl));
    S.maxHp += 50; S.hp = S.maxHp;
    S.maxEn += 30; S.en = S.maxEn;
  }
  if (S.lvl >= S.maxLvl) S.xp = 0;
  updateHUD();
}

function updateHUD() {
  document.getElementById('ui-lvl').innerText = `Lv. ${S.lvl} / ${S.maxLvl}`;
  document.getElementById('ui-money').innerText = `$ ${S.money.toLocaleString()}`;
  
  const xpPct = S.lvl >= S.maxLvl ? 100 : (S.xp / S.xpNext) * 100;
  document.getElementById('ui-xp').style.width = xpPct + '%';
  document.getElementById('ui-xp-txt').innerText = S.lvl >= S.maxLvl ? 'MAX' : `${S.xp} / ${S.xpNext} XP`;
  
  document.getElementById('ui-hp').style.width = (S.hp / S.maxHp * 100) + '%';
  document.getElementById('ui-hp-val').innerText = `${S.hp}/${S.maxHp}`;
  document.getElementById('ui-en').style.width = (S.en / S.maxEn * 100) + '%';
  document.getElementById('ui-en-val').innerText = `${S.en}/${S.maxEn}`;
}

// Iniciar
initScene();
updateHUD();

// Ganar dinero pasivo
setInterval(() => {
  if(S.playing) { S.money += 25; updateHUD(); }
}, 2000);


// ===== CONTROLES TÁCTILES Y TECLADO =====
const joy = document.getElementById('joy');
const knob = document.getElementById('knob');
let joyActive = false, center = {x:0, y:0}, maxDist = 40;

function joyStart(e) {
  joyActive = true;
  const r = joy.getBoundingClientRect();
  center = {x: r.left + r.width/2, y: r.top + r.height/2};
  if(e.type==='touchstart') e.preventDefault();
}
function joyMove(e) {
  if(!joyActive) return;
  if(e.type==='touchmove') e.preventDefault();
  let cx = e.touches ? e.touches[0].clientX : e.clientX;
  let cy = e.touches ? e.touches[0].clientY : e.clientY;
  let dx = cx - center.x, dy = cy - center.y;
  const dist = Math.hypot(dx, dy);
  if(dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  S.joyX = dx/maxDist; S.joyY = dy/maxDist;
}
function joyEnd() {
  joyActive = false;
  knob.style.transform = `translate(0px, 0px)`;
  S.joyX = 0; S.joyY = 0;
}
joy.addEventListener('mousedown', joyStart); document.addEventListener('mousemove', joyMove); document.addEventListener('mouseup', joyEnd);
joy.addEventListener('touchstart', joyStart, {passive:false}); document.addEventListener('touchmove', joyMove, {passive:false}); document.addEventListener('touchend', joyEnd);

window.jump = function() {
  if (!S.isJumping) { S.velY = 15; S.isJumping = true; }
};

const keys = {w:0,a:0,s:0,d:0};
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if(keys.hasOwnProperty(k)) keys[k] = 1;
  if(e.code === 'Space') window.jump();
});
document.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if(keys.hasOwnProperty(k)) keys[k] = 0;
});

// Update loop para teclado
setInterval(() => {
  if(!S.playing) return;
  let kx = (keys.d - keys.a), ky = (keys.s - keys.w);
  if(kx !== 0 || ky !== 0) { S.joyX = kx; S.joyY = ky; }
  else if(!joyActive) { S.joyX = 0; S.joyY = 0; }
}, 20);

</script>
</body>
</html>
